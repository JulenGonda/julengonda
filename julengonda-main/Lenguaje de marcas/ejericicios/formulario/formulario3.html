<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Notas</title>

    <style>
        .formulario {
            width: 350px;
            padding: 15px;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 24px;
        }
        label {
            display: inline-block;
            width: 60px;
        }
        .fila {
            margin-bottom: 5px;
        }
        table {
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            padding: 2px;
        }
        .asignatura {
            width: 110px;
        }
        .nota {
            width: 130px;
        }
    </style>
</head>

<body>

    <div class="formulario">
        <h1>Formulario de Notas</h1>

        <form action="https://localhost:44351/guardar.html?tnombre=Xabier&tapellido=Iraeta&tfeha=2022-09-27&tasinatura1=1&tnota1=6&tasinatura2=2&tnota2=7&tasinatura3=3&tnota3=8&tmedia=7" method="get">

            <div class="fila">
                <label>Nombre:</label>
                <input type="text" name="nombre">
            </div>

            <div class="fila">
                <label>Apellido:</label>
                <input type="text" name="apellido">
            </div>

            <div class="fila">
                <label>Fecha:</label>
                <input type="date" name="fcha">
            </div>

            <table>
                <tr>
                    <th>Asignatura</th>
                    <th>Nota</th>
                </tr>

                <tr>
                    <td>
                        <select name="tasignatura1" class="asignatura">
                            <option value="1">Lenguaje de Marcas</option>
                            <option value="2">Programación</option>
                            <option value="3">Bases de Datos</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" name="nota1" class="nota">
                    </td>
                </tr>

                <tr>
                    <td>
                        <select name="tasignatura2" class="asignatura">
                            <option value="1">Lenguaje de Marcas</option>
                            <option value="2">Programación</option>
                            <option value="3">Bases de Datos</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" name="nota2" class="nota">
                    </td>
                </tr>

                <tr>
                    <td>
                        <select name="tasignatura3" class="asignatura">
                            <option value="1">Lenguaje de Marcas</option>
                            <option value="2">Programación</option>
                            <option value="3">Bases de Datos</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" name="nota3" class="nota">
                    </td>
                </tr>

                <tr>
                    <td>Media:</td>
                    <td>
                        <input type="number" name="media" class="nota">
                    </td>
                </tr>

            <input type="submit" value="Guardar">

        </form>
    </div>

</div>

</body>
</html>
